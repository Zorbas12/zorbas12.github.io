<!DOCTYPE html>
<html lang="en">
<head>
<script>window.addEventListener('beforeinstallprompt', e => e.preventDefault());</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<meta name="darkreader-lock">
<link rel="icon" type="image/png" href="https://www.zorbas.com.cy/wp-content/uploads/cropped-zorbas-favicon-01-270x270.png">
<title>Zorbas — Schedule</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#E8E6E3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Zorbas">
<meta name="author" content="KVWX">
<link rel="apple-touch-icon" href="https://www.zorbas.com.cy/wp-content/uploads/cropped-zorbas-favicon-01-270x270.png">
<link rel="stylesheet" href="/shared.css">
<style>
/* ═══════════════════════════════════════════════
   SCHEDULE OVERLAY
   ═══════════════════════════════════════════════ */

/* Hide the global lang buttons when schedule is open — we have our own */
body.schedule-open .lang-buttons { display: none !important; }

#schedule-submissions-gui {
  display: none;
  position: fixed;
  inset: 0;
  background: #E8E6E3;
  z-index: 9999;
  flex-direction: column;
  align-items: stretch;
  overflow: hidden;
  isolation: isolate;
}

#schedule-submissions-gui::before {
  content: "";
  position: absolute;
  top: 0; left: 0;
  width: 0; height: 0;
  border-style: solid;
  border-width: 100vh 100vw 0 0;
  border-color: #DAD9D7 transparent transparent transparent;
  z-index: 0;
  pointer-events: none;
}

/* ── Top bar: [Print] [Edit] [Toolbar] ··· [EL/EN] ── */
#sched-top {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  flex-shrink: 0;
  position: relative;
  z-index: 2;
  box-sizing: border-box;
}

#sched-top button {
  flex-shrink: 0;
  height: 34px;
  padding: 0 14px;
  border: none;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: background-color 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}

#sched-print-btn  { background: #E8DA89; color: #111; display: none; }
#sched-edit-btn   { background: #E8DA89; color: #111; display: none; }
#sched-toolbar-btn {
  background: #E8DA89; color: #111; display: none;
  width: 34px; padding: 0;
  flex-direction: column; justify-content: center;
  align-items: center; gap: 4px;
}
#sched-toolbar-btn span {
  display: block; width: 14px; height: 2px;
  background: #333; border-radius: 2px;
}

#sched-top-spacer { flex: 1; }

/* Lang inside overlay — top-right, nudged right on phone */
#sched-lang {
  display: flex;
  align-items: center;
  flex-shrink: 0;
  margin-right: 4px;
}
@media (max-width: 768px) {
  #sched-lang { margin-right: 10px; }
}
#sched-lang button {
  background: none;
  border: none;
  font-size: 13px;
  font-weight: 400;
  color: #888;
  cursor: pointer;
  padding: 4px 6px;
  height: auto;
  transition: color 0.2s;
}
#sched-lang button.active { font-weight: 600; color: #111; }
#sched-lang .divider { color: #ccc; font-size: 12px; padding: 0 2px; }

/* ── Table scroll area ── */
#sched-scroll {
  flex: 1;
  overflow: auto;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-x pan-y pinch-zoom;
  padding: 0 14px 60px;
  position: relative;
  z-index: 1;
  min-height: 0;
  display: flex;
  align-items: flex-start;
  justify-content: center;
}

#sched-table-wrap {
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  padding: 12px;
  flex-shrink: 0;
  transform-origin: top center;
}

#schedule-edit-table {
  border-collapse: collapse;
  background: #fff;
  width: max-content;
}

#schedule-edit-table td {
  border: 1px solid #ccc;
  padding: 8px 10px;
  min-width: 70px;
  min-height: 32px;
  text-align: center;
  white-space: nowrap;
  font-size: 13px;
}

#schedule-edit-table td.cell-editing { background: #fffef5; cursor: text; }
#schedule-edit-table td.cell-editing:focus { outline: 2px solid #E8DA89; outline-offset: -1px; }

/* ── Back button — absolute bottom-left inside overlay ── */
#sched-back-btn {
  position: absolute;
  bottom: 16px;
  left: 16px;
  z-index: 3;
  height: 36px;
  padding: 0 18px;
  border: none;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  background: #ff4c4c;
  color: #fff;
  white-space: nowrap;
  transition: background-color 0.2s;
}

/* ── Portrait phone: rotate 90° — identical to landscape ── */
@media (orientation: portrait) and (max-width: 768px) {
  #schedule-submissions-gui {
    /* After rotation: width=100vh (long side), height=100vw (short side)
       This is IDENTICAL to landscape dimensions. */
    width:  100vh !important;
    height: 100vw !important;
    top: 0 !important;
    left: 0 !important;
    transform: rotate(90deg) translateY(-100vw) !important;
    transform-origin: top left !important;
    overflow: hidden !important;
  }

  /* Scroll area must fill the full rotated width with no extra offsets */
  #sched-scroll {
    /* Use the rotated long-side as reference — 100% of the rotated width */
    padding-left: 0 !important;
    padding-right: 0 !important;
    padding-bottom: 60px !important;
    justify-content: flex-start !important;
  }

  /* Table wrap: no extra transform, just let it sit naturally */
  #sched-table-wrap {
    transform: none !important;
    margin: 0 14px !important;
  }
}

/* ── Landscape phone (auto-rotate): fill normally, no transform ── */
@media (orientation: landscape) and (max-height: 500px) {
  #schedule-submissions-gui {
    transform: none !important;
    width: 100% !important;
    height: 100% !important;
    overflow: hidden !important;
  }
}



/* ── Print ── */
@media print {
  #sched-top, #sched-back-btn { display: none !important; }
  #schedule-submissions-gui {
    position: static !important; transform: none !important;
    overflow: visible !important; height: auto !important; width: auto !important;
  }
  #sched-scroll { overflow: visible !important; padding: 0 !important; }
  #sched-table-wrap { box-shadow: none !important; transform: none !important; }
}
</style>
</head>
<body>

<!-- Location picker -->
<div id="schedule-gui" style="display:none;">
  <div class="form-title" style="margin-bottom:24px;" id="schedule-gui-title">Schedule</div>
  <button class="schedule-location-btn" data-loc="NICOSIA">Nicosia</button>
  <button class="schedule-location-btn" data-loc="LARNACA">Larnaca</button>
  <button class="schedule-location-btn" data-loc="FAMAGUSTA">Ammochostos</button>
  <button class="schedule-location-btn" data-loc="LIMASSOL">Limassol</button>
  <button class="schedule-location-btn" data-loc="PAFOS">Pafos</button>
  <button id="back-schedule">Back</button>
</div>

<!-- Store picker -->
<div class="store-gui" id="store-gui-schedule">
  <div id="store-gui-schedule-title" class="form-title" style="margin-bottom:24px;"></div>
  <div id="store-buttons-container-schedule"></div>
  <button class="back-store-btn" id="back-store-schedule">Back</button>
</div>

<script type="module">
import {
  db, ref, onValue, set, get, update, deviceRef,
  registerDevice, translations, stores,
  showPopup, buildNoPermissionPage, buildNotFoundPage,
  fitToScreen, triggerNotification
} from "/shared.js";

let currentLangLocal = localStorage.getItem('zorbas_lang') || "EN";
function tr(key) { return translations[currentLangLocal][key] || key; }

registerDevice();

// ── URL helpers ──
function toSlug(name) { return name.toLowerCase().replace(/\s+/g,"-").replace(/[^a-z0-9\-]/g,""); }
function slugToLocation(slug) { return Object.keys(stores).find(l => l.toLowerCase() === slug.toLowerCase()) || null; }
function slugToStore(locKey, slug) { return (stores[locKey]?.EN || []).find(s => toSlug(s) === slug) || null; }

// ── No-perm / not-found pages ──
const noPermPage = buildNoPermissionPage(() => {
  history.replaceState(null,"","/schedule");
  noPermPage.style.display = "none";
  scheduleGui.style.display = "flex";
});
const notFoundPage = buildNotFoundPage(() => {
  history.replaceState(null,"","/schedule");
  notFoundPage.style.display = "none";
  scheduleGui.style.display = "flex";
});

// ── DOM ──
const scheduleGui  = document.getElementById("schedule-gui");
const storeGuiSchedule = document.getElementById("store-gui-schedule");
const storeButtonsContainerSchedule = document.getElementById("store-buttons-container-schedule");
const greekBtn = document.getElementById("greek-btn");
const engBtn   = document.getElementById("eng-btn");

document.getElementById("back-schedule").addEventListener("click", () => { window.location.href = "/"; });
document.getElementById("back-store-schedule").addEventListener("click", () => {
  storeGuiSchedule.style.display = "none";
  scheduleGui.style.display = "flex";
  history.pushState(null,"","/schedule");
});
document.querySelectorAll(".schedule-location-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const loc = btn.dataset.loc;
    currentLocKey = loc;
    scheduleGui.style.display = "none";
    storeButtonsContainerSchedule.innerHTML = "";
    document.getElementById("store-gui-schedule-title").textContent = btn.textContent;
    stores[loc][currentLangLocal].forEach((store, i) => {
      const b = document.createElement("button");
      b.textContent = store;
      b.dataset.location = loc;
      b.dataset.storeEN = stores[loc].EN[i];
      storeButtonsContainerSchedule.appendChild(b);
    });
    storeGuiSchedule.style.display = "flex";
    history.pushState(null,"",`/schedule/${loc.toLowerCase()}`);
  });
});

// ══════════════════════════════════════════════
// ── Build the schedule overlay ──
// ══════════════════════════════════════════════
const gui = document.createElement("div");
gui.id = "schedule-submissions-gui";
document.body.appendChild(gui);

// ── Top bar: [Print] [Edit] [Toolbar] ··· [EL/EN] ──
const bar = document.createElement("div");
bar.id = "sched-top";
gui.appendChild(bar);

const printBtn = document.createElement("button");
printBtn.id = "sched-print-btn";
printBtn.textContent = tr("printSchedule");
printBtn.addEventListener("click", () => window.print());
bar.appendChild(printBtn);

const editBtn = document.createElement("button");
editBtn.id = "sched-edit-btn";
editBtn.textContent = tr("editSchedule");
bar.appendChild(editBtn);

const toolbarBtn = document.createElement("button");
toolbarBtn.id = "sched-toolbar-btn";
toolbarBtn.innerHTML = "<span></span><span></span><span></span>";
bar.appendChild(toolbarBtn);

// Spacer
const spacer = document.createElement("div");
spacer.id = "sched-top-spacer";
bar.appendChild(spacer);

// Lang switcher inside the overlay
const langBox = document.createElement("div");
langBox.id = "sched-lang";
langBox.innerHTML = `<button id="greek-btn">ΕΛΛ</button><span class="divider">/</span><button id="eng-btn" class="active">ENG</button>`;
bar.appendChild(langBox);

// ── Back button — absolute bottom-left ──
const backBtn = document.createElement("button");
backBtn.id = "sched-back-btn";
backBtn.textContent = tr("back");
gui.appendChild(backBtn);

// Title element (used for openStore, not shown in bar)
const titleEl = document.createElement("div");
titleEl.id = "sched-title";
titleEl.style.display = "none";
gui.appendChild(titleEl);

// Scroll area
const scrollArea = document.createElement("div");
scrollArea.id = "sched-scroll";
gui.appendChild(scrollArea);

// Table wrapper
const tableWrap = document.createElement("div");
tableWrap.id = "sched-table-wrap";
scrollArea.appendChild(tableWrap);

// Table
const table = document.createElement("table");
table.id = "schedule-edit-table";
for (let i = 0; i < 12; i++) {
  const row = table.insertRow();
  for (let j = 0; j < 12; j++) {
    const cell = row.insertCell();
    cell.contentEditable = "false";
  }
}
tableWrap.appendChild(table);

// ── Toolbar sidebar ──
const toolbarOverlay = document.createElement("div");
toolbarOverlay.id = "toolbar-overlay";
toolbarOverlay.style.cssText = "display:none;position:fixed;inset:0;z-index:10001;";
document.body.appendChild(toolbarOverlay);

const toolbarSidebar = document.createElement("div");
toolbarSidebar.id = "toolbar-sidebar";
toolbarSidebar.className = "toolbar-sidebar";
toolbarSidebar.innerHTML = `
  <div style="position:absolute;top:0;left:0;right:0;padding:14px 14px 12px;background:#fff;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;">
    <span style="color:#333;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;" id="tb-format-label">${tr("format")}</span>
    <button class="toolbar-close">✕</button>
  </div>
  <div class="toolbar-section">
    <div class="toolbar-section-title" id="tb-textstyle-label">${tr("textStyle")}</div>
    <button class="toolbar-button" data-action="bold"><span class="toolbar-button-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 4h8a4 4 0 0 1 0 8H6z"/><path d="M6 12h9a4 4 0 0 1 0 8H6z"/></svg></span><span id="tb-bold">${tr("bold")}</span></button>
    <button class="toolbar-button" data-action="italic"><span class="toolbar-button-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="4" x2="10" y2="4"/><line x1="14" y1="20" x2="5" y2="20"/><line x1="15" y1="4" x2="9" y2="20"/></svg></span><span id="tb-italic">${tr("italic")}</span></button>
    <button class="toolbar-button" data-action="underline"><span class="toolbar-button-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 4v6a6 6 0 0 0 12 0V4"/><line x1="4" y1="20" x2="20" y2="20"/></svg></span><span id="tb-underline">${tr("underline")}</span></button>
  </div>
  <div class="toolbar-section">
    <div class="toolbar-section-title" id="tb-align-label">${tr("alignment")}</div>
    <button class="toolbar-button" data-action="align-left"><span class="toolbar-button-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="18" y2="18"/></svg></span><span id="tb-alignleft">${tr("alignLeft")}</span></button>
    <button class="toolbar-button" data-action="align-center"><span class="toolbar-button-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="6" x2="21" y2="6"/><line x1="6" y1="12" x2="18" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg></span><span id="tb-aligncenter">${tr("alignCenter")}</span></button>
    <button class="toolbar-button" data-action="align-right"><span class="toolbar-button-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="6" x2="21" y2="6"/><line x1="9" y1="12" x2="21" y2="12"/><line x1="6" y1="18" x2="21" y2="18"/></svg></span><span id="tb-alignright">${tr("alignRight")}</span></button>
  </div>
  <div class="toolbar-section">
    <div class="toolbar-section-title" id="tb-rowscols-label">${tr("rowsCols")}</div>
    <button class="toolbar-button" data-action="add-row"><span class="toolbar-button-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="12" y1="16" x2="12" y2="20"/><line x1="9" y1="18" x2="15" y2="18"/></svg></span><span id="tb-addrow">${tr("addRow")}</span></button>
    <button class="toolbar-button" data-action="remove-row"><span class="toolbar-button-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="9" y1="18" x2="15" y2="18"/></svg></span><span id="tb-removerow">${tr("removeRow")}</span></button>
    <button class="toolbar-button" data-action="add-column"><span class="toolbar-button-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="3" x2="12" y2="21"/><line x1="16" y1="12" x2="20" y2="12"/><line x1="18" y1="9" x2="18" y2="15"/></svg></span><span id="tb-addcol">${tr("addColumn")}</span></button>
    <button class="toolbar-button" data-action="remove-column"><span class="toolbar-button-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="3" x2="12" y2="21"/><line x1="16" y1="12" x2="20" y2="12"/></svg></span><span id="tb-removecol">${tr("removeColumn")}</span></button>
  </div>
  <div class="toolbar-section">
    <div class="toolbar-section-title" id="tb-cell-label">${tr("cell")}</div>
    <button class="toolbar-button" data-action="color-cell"><span class="toolbar-button-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="15" rx="2"/><rect x="2" y="18" width="20" height="4" rx="1" fill="currentColor" stroke="currentColor"/></svg></span><span id="tb-fillcolor">${tr("fillColor")}</span></button>
    <button class="toolbar-button" data-action="color-text"><span class="toolbar-button-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M11 2L5.5 17h2.25l1.12-3h6.26l1.12 3H18.5L13 2h-2zm-1.38 10L12 5.67 14.38 12H9.62z"/><rect x="3" y="19" width="18" height="3" rx="1"/></svg></span><span id="tb-textcolor">${tr("textColor")}</span></button>
    <button class="toolbar-button" data-action="clear-cell"><span class="toolbar-button-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg></span><span id="tb-clearcell">${tr("clearCell")}</span></button>
  </div>
`;
document.body.appendChild(toolbarSidebar);

toolbarBtn.addEventListener("click", () => {
  const opening = !toolbarSidebar.classList.contains("open");
  toolbarSidebar.classList.toggle("open");
  toolbarOverlay.style.display = opening ? "block" : "none";
});
toolbarOverlay.addEventListener("click", () => {
  toolbarSidebar.classList.remove("open");
  toolbarOverlay.style.display = "none";
});
toolbarSidebar.querySelector(".toolbar-close").addEventListener("click", () => {
  toolbarSidebar.classList.remove("open");
  toolbarOverlay.style.display = "none";
});

// ══════════════════════════════════════════════
// ── State ──
// ══════════════════════════════════════════════
let isEditMode = false;
let lastSelectedCell = null;
let currentEditingStore = "";
let currentEditingLocation = "";
let currentLocKey = null;
let scheduleUnsubscribe = null;

// ── Cell selection ──
document.addEventListener("click", e => {
  const td = e.target.closest("#schedule-edit-table td");
  if (td && isEditMode) {
    if (lastSelectedCell) lastSelectedCell.style.outline = "";
    lastSelectedCell = td;
    td.style.outline = "2px solid #E8DA89";
  }
});

// ── Edit / Save ──
editBtn.addEventListener("click", () => {
  if (!isEditMode) {
    enableEditing();
    editBtn.textContent = tr("saveSchedule");
    editBtn.style.backgroundColor = "#90EE90";
    toolbarBtn.style.display = "flex";
    isEditMode = true;
  } else {
    disableEditing();
    saveToFirebase();
    editBtn.textContent = tr("editSchedule");
    editBtn.style.backgroundColor = "#E8DA89";
    toolbarBtn.style.display = "none";
    toolbarSidebar.classList.remove("open");
    toolbarOverlay.style.display = "none";
    isEditMode = false;
  }
});

// ── Back ──
backBtn.addEventListener("click", () => {
  autoSave();
  closeSchedule();
});

// ── Toolbar actions ──
toolbarSidebar.addEventListener("click", e => {
  const btn = e.target.closest(".toolbar-button");
  if (!btn) return;
  const action = btn.dataset.action;
  const sel = lastSelectedCell;

  const needSel = ["bold","italic","underline","align-left","align-center","align-right","color-cell","color-text","clear-cell"];
  if (needSel.includes(action) && !sel) { showPopup(tr("selectCellFirst"), "error"); return; }

  if (action === "bold")         { sel.focus(); document.execCommand("bold"); }
  else if (action === "italic")  { sel.focus(); document.execCommand("italic"); }
  else if (action === "underline") { sel.focus(); document.execCommand("underline"); }
  else if (action === "align-left")   { sel.style.textAlign = "left";   showPopup(tr("alignedLeft"),   "success"); }
  else if (action === "align-center") { sel.style.textAlign = "center"; showPopup(tr("alignedCenter"), "success"); }
  else if (action === "align-right")  { sel.style.textAlign = "right";  showPopup(tr("alignedRight"),  "success"); }
  else if (action === "color-cell") { pickColor("#ffffff", v => { sel.style.backgroundColor = v; showPopup(tr("cellColorChanged"), "success"); }); }
  else if (action === "color-text") { pickColor("#000000", v => { sel.style.color = v; showPopup(tr("textColorChanged"), "success"); }); }
  else if (action === "clear-cell") { sel.textContent = ""; sel.removeAttribute("style"); sel.classList.toggle("cell-editing", isEditMode); showPopup(tr("cellCleared"), "success"); }
  else if (action === "add-row") {
    const newRow = table.insertRow();
    for (let i = 0; i < table.rows[0].cells.length; i++) addCell(newRow.insertCell());
    showPopup(tr("rowAdded"), "success"); fitTable();
  }
  else if (action === "remove-row") {
    if (table.rows.length > 1) { table.deleteRow(table.rows.length - 1); showPopup(tr("rowRemoved"), "success"); fitTable(); }
    else showPopup(tr("cannotRemoveLastRow"), "error");
  }
  else if (action === "add-column") {
    for (let i = 0; i < table.rows.length; i++) addCell(table.rows[i].insertCell());
    showPopup(tr("colAdded"), "success"); fitTable();
  }
  else if (action === "remove-column") {
    if (table.rows[0].cells.length > 1) {
      for (let i = 0; i < table.rows.length; i++) table.rows[i].deleteCell(table.rows[i].cells.length - 1);
      showPopup(tr("colRemoved"), "success"); fitTable();
    } else showPopup(tr("cannotRemoveLastCol"), "error");
  }
});

function pickColor(def, cb) {
  const ci = document.createElement("input");
  ci.type = "color"; ci.value = def;
  ci.style.cssText = "position:fixed;opacity:0;pointer-events:none;";
  document.body.appendChild(ci);
  ci.addEventListener("change", ev => { cb(ev.target.value); ci.remove(); });
  ci.addEventListener("cancel", () => ci.remove());
  ci.click();
}

function addCell(cell) {
  cell.style.cssText = "border:1px solid #ccc;padding:8px 10px;min-width:70px;min-height:32px;text-align:center;white-space:nowrap;font-size:13px;";
  if (isEditMode) { cell.contentEditable = "true"; cell.classList.add("cell-editing"); }
  else cell.contentEditable = "false";
}

function enableEditing() {
  table.querySelectorAll("td").forEach(c => {
    c.contentEditable = "true";
    c.classList.add("cell-editing");
  });
}

function disableEditing() {
  table.querySelectorAll("td").forEach(c => {
    c.contentEditable = "false";
    c.classList.remove("cell-editing");
  });
  if (lastSelectedCell) { lastSelectedCell.style.outline = ""; lastSelectedCell = null; }
}

function autoSave() {
  if (isEditMode && currentEditingStore && currentEditingLocation) saveToFirebase();
}

function closeSchedule() {
  gui.style.display = "none";
  document.body.classList.remove("schedule-open");
  storeGuiSchedule.style.display = "flex";
  cleanupToolbar();
  disableEditing();
  isEditMode = false;
  editBtn.textContent = tr("editSchedule");
  editBtn.style.backgroundColor = "#E8DA89";
  if (currentEditingLocation) history.pushState(null, "", `/schedule/${currentEditingLocation.toLowerCase()}`);
}

function cleanupToolbar() {
  toolbarBtn.style.display = "none";
  toolbarSidebar.classList.remove("open");
  toolbarOverlay.style.display = "none";
  printBtn.style.display = "none";
  editBtn.style.display = "none";
}

// ══════════════════════════════════════════════
// ── Firebase save ──
// ══════════════════════════════════════════════
function saveToFirebase() {
  const data = [];
  for (let i = 0; i < table.rows.length; i++) {
    const row = [];
    for (let j = 0; j < table.rows[i].cells.length; j++) {
      const c = table.rows[i].cells[j];
      const cs = window.getComputedStyle(c);
      row.push({
        text: c.textContent,
        bold: cs.fontWeight === "bold" || parseInt(cs.fontWeight) >= 600,
        italic: cs.fontStyle === "italic",
        underline: cs.textDecoration.includes("underline"),
        align: c.style.textAlign || "center",
        bgColor: c.style.backgroundColor || "",
        textColor: c.style.color || ""
      });
    }
    data.push(row);
  }
  set(ref(db, `schedules/${currentEditingLocation}/${currentEditingStore}`), data);
  showPopup(tr("scheduleSaved"), "success");

  // Notify affected employees
  const _loc = currentEditingLocation, _store = currentEditingStore;
  get(ref(db, "submissions")).then(snap => {
    const subs = snap.val() || {};
    const latestByDevice = {};
    Object.values(subs).forEach(sub => {
      if (!sub.deviceId) return;
      const prev = latestByDevice[sub.deviceId];
      if (!prev || sub.timestamp > prev.timestamp) latestByDevice[sub.deviceId] = sub;
    });
    const locSlug = _loc.toLowerCase();
    const storeSlug = _store.toLowerCase().replace(/\s+/g,"-").replace(/[^a-z0-9-]/g,"");
    Object.entries(latestByDevice).forEach(([targetDeviceId, sub]) => {
      if (sub.store !== _store) return;
      triggerNotification(targetDeviceId, "🗓 New schedule", `New schedule on ${_store}`, `/schedule/${locSlug}/${storeSlug}`);
    });
  }).catch(() => {});
}

// ══════════════════════════════════════════════
// ── Firebase load ──
// ══════════════════════════════════════════════
function loadFromFirebase(location, store) {
  currentEditingLocation = location;
  currentEditingStore = store;
  if (scheduleUnsubscribe) { scheduleUnsubscribe(); scheduleUnsubscribe = null; }

  scheduleUnsubscribe = onValue(ref(db, `schedules/${location}/${store}`), snap => {
    if (snap.exists()) {
      const sd = snap.val();
      // Resize rows
      while (table.rows.length > sd.length) table.deleteRow(table.rows.length - 1);
      while (table.rows.length < sd.length) {
        const r = table.insertRow();
        for (let j = 0; j < (sd[0]?.length || 12); j++) addCell(r.insertCell());
      }
      for (let i = 0; i < sd.length; i++) {
        const rowData = sd[i];
        // Resize cols
        while (table.rows[i].cells.length > rowData.length) table.rows[i].deleteCell(table.rows[i].cells.length - 1);
        while (table.rows[i].cells.length < rowData.length) addCell(table.rows[i].insertCell());
        for (let j = 0; j < rowData.length; j++) {
          const cd = rowData[j];
          const cell = table.rows[i].cells[j];
          if (typeof cd === "object") {
            cell.textContent = cd.text || "";
            cell.style.fontWeight = cd.bold ? "bold" : "normal";
            cell.style.fontStyle = cd.italic ? "italic" : "normal";
            cell.style.textDecoration = cd.underline ? "underline" : "none";
            cell.style.textAlign = cd.align || "center";
            cell.style.backgroundColor = cd.bgColor || "";
            cell.style.color = cd.textColor || "";
          } else {
            cell.textContent = cd || "";
          }
        }
      }
    } else {
      // Clear
      table.querySelectorAll("td").forEach(c => {
        c.textContent = "";
        c.style.cssText = "";
      });
    }
    requestAnimationFrame(fitTable);
  });
}

// ══════════════════════════════════════════════
// ── fitTable: scale down on desktop if too wide ──
// ══════════════════════════════════════════════
function fitTable() {
  tableWrap.style.transform = "";
  tableWrap.style.marginBottom = "";

  // On narrow screens let native scroll handle overflow — no scaling needed
  const isPhone = window.innerWidth <= 600;
  if (isPhone) return;

  const availW = scrollArea.clientWidth  - 28;
  const availH = scrollArea.clientHeight - 14;
  const natW   = tableWrap.scrollWidth;
  const natH   = tableWrap.scrollHeight;
  if (!natW || !natH || availW <= 0 || availH <= 0) return;

  const scale = Math.min(availW / natW, availH / natH, 1);
  if (scale < 1) {
    tableWrap.style.transform = `scale(${scale})`;
    tableWrap.style.marginBottom = (natH * scale - natH) + "px";
  }
}
window.addEventListener("resize", fitTable);
window.addEventListener("orientationchange", () => setTimeout(fitTable, 200));

// ══════════════════════════════════════════════
// ── Open store ──
// ══════════════════════════════════════════════
function openStore(locKey, storeEN, displayName, replaceHistory = false) {
  titleEl.textContent = `${displayName} — ${tr("schedule")}`;
  scheduleGui.style.display = "none";
  storeGuiSchedule.style.display = "none";
  gui.style.display = "flex";
  document.body.classList.add("schedule-open");
  printBtn.style.display = "flex";
  editBtn.style.display = "none";

  const url = `/schedule/${locKey.toLowerCase()}/${toSlug(storeEN)}`;
  if (replaceHistory) history.replaceState(null, "", url);
  else history.pushState(null, "", url);

  // Check edit permission
  get(deviceRef).then(snap => {
    if (!snap.exists()) return;
    const d = snap.val();
    const role = d.role || "user";
    const storeRoles = Array.isArray(d.storeRoles) ? d.storeRoles : [];
    if (typeof role === "string" && role.startsWith("store:")) {
      const leg = role.replace("store:", "");
      if (!storeRoles.includes(leg)) storeRoles.push(leg);
    }
    if (role === "owner" || storeRoles.includes(storeEN)) {
      editBtn.style.display = "flex";
    }
  });

  loadFromFirebase(locKey, storeEN);
  requestAnimationFrame(() => requestAnimationFrame(fitTable));
}

storeButtonsContainerSchedule.addEventListener("click", e => {
  const btn = e.target.closest("button:not(.back-store-btn)");
  if (!btn) return;
  openStore(btn.dataset.location, btn.dataset.storeEN, btn.textContent);
});

// ══════════════════════════════════════════════
// ── Routing ──
// ══════════════════════════════════════════════
function hideAll() {
  scheduleGui.style.display = "none";
  storeGuiSchedule.style.display = "none";
  gui.style.display = "none";
  document.body.classList.remove("schedule-open");
  noPermPage.style.display = "none";
  notFoundPage.style.display = "none";
  cleanupToolbar();
}

function applyRoute() {
  const raw = window.location.pathname;
  const match = raw.match(/\/schedule(?:\.html)?\/?(.*)$/);
  if (!match) { hideAll(); scheduleGui.style.display = "flex"; return; }

  const parts = match[1].replace(/^\/+/,"").split("/").filter(Boolean);
  const locSlug = parts[0] || "";
  const storeSlug = parts[1] || "";

  if (!locSlug) { hideAll(); scheduleGui.style.display = "flex"; return; }

  const locKey = slugToLocation(locSlug);
  if (!locKey) { hideAll(); notFoundPage.style.display = "flex"; return; }

  if (!storeSlug) {
    hideAll();
    storeButtonsContainerSchedule.innerHTML = "";
    const locBtn = document.querySelector(`.schedule-location-btn[data-loc="${locKey}"]`);
    document.getElementById("store-gui-schedule-title").textContent = locBtn ? locBtn.textContent : locKey;
    stores[locKey][currentLangLocal].forEach((store, i) => {
      const b = document.createElement("button");
      b.textContent = store;
      b.dataset.location = locKey;
      b.dataset.storeEN = stores[locKey].EN[i];
      storeButtonsContainerSchedule.appendChild(b);
    });
    storeGuiSchedule.style.display = "flex";
    return;
  }

  const storeEN = slugToStore(locKey, storeSlug);
  if (!storeEN) { hideAll(); notFoundPage.style.display = "flex"; return; }

  const enIdx = stores[locKey].EN.indexOf(storeEN);
  const displayName = enIdx !== -1 ? stores[locKey][currentLangLocal][enIdx] : storeEN;
  openStore(locKey, storeEN, displayName, true);
}

applyRoute();
window.addEventListener("popstate", () => { autoSave(); applyRoute(); });
window.addEventListener("pagehide",  () => { autoSave(); cleanupToolbar(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) { autoSave(); cleanupToolbar(); } });

// ══════════════════════════════════════════════
// ── Language ──
// ══════════════════════════════════════════════
function switchLang(lang) {
  currentLangLocal = lang;
  localStorage.setItem('zorbas_lang', lang);
  const t = translations[lang];
  greekBtn.classList.toggle("active", lang === "GR");
  engBtn.classList.toggle("active",   lang === "EN");

  document.getElementById("schedule-gui-title").textContent = t.schedule;
  document.querySelectorAll(".schedule-location-btn").forEach(b => { b.textContent = t[`loc_${b.dataset.loc}`]; });
  document.getElementById("back-schedule").textContent = t.back;
  document.getElementById("back-store-schedule").textContent = t.back;

  backBtn.textContent = t.back;
  printBtn.textContent = t.printSchedule;
  if (!isEditMode) editBtn.textContent = t.editSchedule;

  // Toolbar labels
  const setT = (id, key) => { const el = document.getElementById(id); if (el) el.textContent = t[key] || t[key.toLowerCase()] || ""; };
  setT("tb-format-label","format"); setT("tb-textstyle-label","textStyle");
  setT("tb-align-label","alignment"); setT("tb-rowscols-label","rowsCols"); setT("tb-cell-label","cell");
  setT("tb-bold","bold"); setT("tb-italic","italic"); setT("tb-underline","underline");
  setT("tb-alignleft","alignLeft"); setT("tb-aligncenter","alignCenter"); setT("tb-alignright","alignRight");
  setT("tb-addrow","addRow"); setT("tb-removerow","removeRow"); setT("tb-addcol","addColumn"); setT("tb-removecol","removeColumn");
  setT("tb-fillcolor","fillColor"); setT("tb-textcolor","textColor"); setT("tb-clearcell","clearCell");

  // Rebuild store list if picker open
  if (currentLocKey && storeGuiSchedule.style.display !== "none") {
    document.getElementById("store-gui-schedule-title").textContent = t[`loc_${currentLocKey}`];
    storeButtonsContainerSchedule.innerHTML = "";
    stores[currentLocKey].EN.forEach((storeEN, i) => {
      const b = document.createElement("button");
      b.textContent = stores[currentLocKey][lang][i];
      b.dataset.location = currentLocKey;
      b.dataset.storeEN = storeEN;
      storeButtonsContainerSchedule.appendChild(b);
    });
  }

  noPermPage.updateLang();
  notFoundPage.updateLang();
}

greekBtn.addEventListener("click", () => switchLang("GR"));
engBtn.addEventListener("click",   () => switchLang("EN"));
switchLang(localStorage.getItem('zorbas_lang') || "EN");

fitToScreen();
</script>
