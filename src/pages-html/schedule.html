// ── URL routing helpers ──
// Converts a store name to a URL slug: "Coffee Berry" → "coffee-berry"
function toSlug(name) {
  return name.toLowerCase().replace(/\s+/g, "-").replace(/[^a-z0-9\-]/g, "");
}

// Finds a location key (e.g. "NICOSIA") from a slug (e.g. "nicosia")
function slugToLocation(slug) {
  return Object.keys(stores).find(loc => loc.toLowerCase() === slug.toLowerCase()) || null;
}

// Finds a store EN name from a slug within a location
function slugToStore(locKey, slug) {
  if (!stores[locKey]) return null;
  return stores[locKey].EN.find(s => toSlug(s) === slug) || null;
}

// Build the routed URL for history API
function buildRouteUrl(locKey, storeEN) {
  return `/schedule/${locKey.toLowerCase()}/${toSlug(storeEN)}`;
}

let lastSelectedCell = null;
document.addEventListener("click", (e) => {
  if(e.target.tagName === "TD" && e.target.closest("#schedule-edit-table") && isEditMode) {

toolbarSidebar.addEventListener("click", (e) => {
  if(!e.target.closest(".toolbar-button")) return;
  const action = e.target.closest(".toolbar-button").dataset.action;
  const table = document.getElementById("schedule-edit-table");
  const sel = lastSelectedCell;
  if(action==="bold"){ if(sel){sel.focus();document.execCommand("bold");}else showPopup(tr("selectCellFirst"),"error"); }
  else if(action==="italic"){ if(sel){sel.focus();document.execCommand("italic");}else showPopup(tr("selectCellFirst"),"error"); }
  else if(action==="underline"){ if(sel){sel.focus();document.execCommand("underline");}else showPopup(tr("selectCellFirst"),"error"); }
  else if(action==="align-left"){ if(sel){sel.style.textAlign="left";showPopup(tr("alignedLeft"),"success");}else showPopup(tr("selectCellFirst"),"error"); }
  else if(action==="align-center"){ if(sel){sel.style.textAlign="center";showPopup(tr("alignedCenter"),"success");}else showPopup(tr("selectCellFirst"),"error"); }
  else if(action==="align-right"){ if(sel){sel.style.textAlign="right";showPopup(tr("alignedRight"),"success");}else showPopup(tr("selectCellFirst"),"error"); }
  else if(action==="color-cell"){ if(sel){const ci=document.createElement("input");ci.type="color";ci.value="#ffffff";ci.style.cssText="position:fixed;opacity:0;pointer-events:none;";document.body.appendChild(ci);ci.addEventListener("change",ev=>{sel.style.backgroundColor=ev.target.value;showPopup(tr("cellColorChanged"),"success");ci.remove();});ci.addEventListener("cancel",()=>ci.remove());ci.click();}else showPopup(tr("selectCellFirst"),"error"); }
  else if(action==="color-text"){ if(sel){const ci=document.createElement("input");ci.type="color";ci.value="#000000";ci.style.cssText="position:fixed;opacity:0;pointer-events:none;";document.body.appendChild(ci);ci.addEventListener("change",ev=>{sel.style.color=ev.target.value;showPopup(tr("textColorChanged"),"success");ci.remove();});ci.addEventListener("cancel",()=>ci.remove());ci.click();}else showPopup(tr("selectCellFirst"),"error"); }
  else if(action==="add-row"){ const newRow=table.insertRow();for(let i=0;i<table.rows[0].cells.length;i++){const c=newRow.insertCell();c.style.cssText=`border:1px solid #ccc;padding:8px;min-width:70px;min-height:35px;text-align:center;white-space:nowrap;`;if(isEditMode){c.contentEditable="true";c.classList.add("cell-editing");c.style.cursor="text";}}showPopup(tr("rowAdded"),"success"); }
  else if(action==="remove-row"){ if(table.rows.length>1){table.deleteRow(table.rows.length-1);showPopup(tr("rowRemoved"),"success");}else showPopup(tr("cannotRemoveLastRow"),"error"); }
  else if(action==="add-column"){ for(let i=0;i<table.rows.length;i++){const c=table.rows[i].insertCell();c.style.cssText=`border:1px solid #ccc;padding:8px;min-width:70px;min-height:35px;text-align:center;white-space:nowrap;`;if(isEditMode){c.contentEditable="true";c.classList.add("cell-editing");c.style.cursor="text";}}showPopup(tr("colAdded"),"success"); }
  else if(action==="remove-column"){ if(table.rows[0].cells.length>1){for(let i=0;i<table.rows.length;i++)table.rows[i].deleteCell(table.rows[i].cells.length-1);showPopup(tr("colRemoved"),"success");}else showPopup(tr("cannotRemoveLastCol"),"error"); }
  else if(action==="clear-cell"){ if(sel){sel.textContent="";showPopup(tr("cellCleared"),"success");}else showPopup(tr("selectCellFirst"),"error"); }
});

function enableTableEditing(){
  document.querySelectorAll("#schedule-edit-table td").forEach(c=>{
    c.contentEditable="true";
    if(!c.style.backgroundColor) c.classList.add("cell-editing");
    c.style.cursor="text";
  });
}
function disableTableEditing(){
  document.querySelectorAll("#schedule-edit-table td").forEach(c=>{
    c.contentEditable="false";
    c.classList.remove("cell-editing");
    c.style.cursor="default";
  });
  if(lastSelectedCell){lastSelectedCell.style.outline="";lastSelectedCell=null;}
}

function saveScheduleToFirebase(){
  const table=document.getElementById("schedule-edit-table");
  const data=[];
  for(let i=0;i<table.rows.length;i++){
    const row=[];
    for(let j=0;j<table.rows[i].cells.length;j++){
      const c=table.rows[i].cells[j];const cs=window.getComputedStyle(c);
      row.push({text:c.textContent,bold:cs.fontWeight==="bold"||parseInt(cs.fontWeight)>=600,italic:cs.fontStyle==="italic",underline:cs.textDecoration.includes("underline"),align:c.style.textAlign||cs.textAlign||"center",bgColor:c.style.backgroundColor||"",textColor:c.style.color||""});
    }
    data.push(row);
  }
  set(ref(db,`schedules/${currentEditingLocation}/${currentEditingStore}`),data);
  showPopup(tr("scheduleSaved"),"success");
}

let scheduleUnsubscribe = null;

function loadScheduleFromFirebase(location, store) {
  currentEditingLocation = location;
  currentEditingStore = store;
  if (scheduleUnsubscribe) { scheduleUnsubscribe(); scheduleUnsubscribe = null; }
  scheduleUnsubscribe = onValue(ref(db, `schedules/${location}/${store}`), snap => {
    const table=document.getElementById("schedule-edit-table");
    if(snap.exists()){
      const sd=snap.val();
      // Trim excess rows
      while(table.rows.length>sd.length) table.deleteRow(table.rows.length-1);
      // Trim excess columns per row
      for(let i=0;i<table.rows.length;i++){
        while(table.rows[i].cells.length>sd[i].length) table.rows[i].deleteCell(table.rows[i].cells.length-1);
      }
      // Add missing rows
      while(table.rows.length<sd.length){const r=table.insertRow();for(let j=0;j<(sd[0].length||12);j++){const c=r.insertCell();c.style.cssText=`border:1px solid #ccc;padding:8px;min-width:70px;min-height:35px;text-align:center;white-space:nowrap;`;c.contentEditable="false";}}
      for(let i=0;i<sd.length&&i<table.rows.length;i++){
        // Add missing columns
        while(table.rows[i].cells.length<sd[i].length){const c=table.rows[i].insertCell();c.style.cssText=`border:1px solid #ccc;padding:8px;min-width:70px;min-height:35px;text-align:center;white-space:nowrap;`;c.contentEditable="false";}
        for(let j=0;j<sd[i].length&&j<table.rows[i].cells.length;j++){
          const cd=sd[i][j];const cell=table.rows[i].cells[j];
          if(typeof cd==="object"){cell.textContent=cd.text||"";cell.style.fontWeight=cd.bold?"bold":"normal";cell.style.fontStyle=cd.italic?"italic":"normal";cell.style.textDecoration=cd.underline?"underline":"none";cell.style.textAlign=cd.align||"center";cell.style.backgroundColor=cd.bgColor||"";cell.style.color=cd.textColor||"";}
          else cell.textContent=cd||"";
        }
      }
    } else {
      for(let i=0;i<table.rows.length;i++)for(let j=0;j<table.rows[i].cells.length;j++){const c=table.rows[i].cells[j];c.textContent="";c.style.fontWeight="normal";c.style.fontStyle="normal";c.style.textDecoration="none";c.style.textAlign="center";c.style.backgroundColor="";c.style.color="";}
    }
  });
}

// ── Open a specific store's schedule (shared by click + URL routing) ──
function openStore(locKey, storeEN, displayName, replaceHistory = false) {
  scheduleTitle.textContent = `${displayName} — ${tr("schedule")}`;
  scheduleGui.style.display = "none";
  storeGuiSchedule.style.display = "none";
  scheduleSubmissionsGui.style.display = "flex";
  printScheduleBtn.style.display = "flex";
  scheduleBackBtn.style.display = "block";
  const url = buildRouteUrl(locKey, storeEN);
  if (replaceHistory) history.replaceState(null, "", url);
  else history.pushState(null, "", url);
  get(deviceRef).then(snap => {
    if (!snap.exists()) return;
    const d = snap.val();
    const role = d.role || "user";
    const storeRoles = Array.isArray(d.storeRoles) ? d.storeRoles : [];
    // Legacy single store: role = "store:X"
    if (typeof role === "string" && role.startsWith("store:")) {
      const legacyStore = role.replace("store:", "");
      if (!storeRoles.includes(legacyStore)) storeRoles.push(legacyStore);
    }
    const canEdit = role === "owner" || storeRoles.includes(storeEN);
    if (canEdit) editScheduleBtn.style.display = "block";
  });
  loadScheduleFromFirebase(locKey, storeEN);
}

storeButtonsContainerSchedule.addEventListener("click", (e) => {
  if(e.target.tagName === "BUTTON" && !e.target.classList.contains("back-store-btn")){
    const storeEN = e.target.dataset.storeEN || e.target.textContent;
    const location = e.target.dataset.location;
    openStore(location, storeEN, e.target.textContent);
  }
});

// ── Hide all views (used before showing the correct one for a route) ──
// ── Auto-save if user leaves while in edit mode ──
function autoSaveIfEditing() {
  if (isEditMode && currentEditingStore && currentEditingLocation) {
    saveScheduleToFirebase();
  }
}

function cleanupToolbar() {
  toolbarToggle.style.display = "none";
  toolbarSidebar.classList.remove("open");
  toolbarOverlay.style.display = "none";
  if (isEditMode) {
    autoSaveIfEditing();
    disableTableEditing();
    isEditMode = false;
    editScheduleBtn.textContent = tr("editSchedule");
    editScheduleBtn.style.backgroundColor = "#E8DA89";
  }
}

function hideAllViews() {
  scheduleGui.style.display = "none";
  storeGuiSchedule.style.display = "none";
  scheduleSubmissionsGui.style.display = "none";
  printScheduleBtn.style.display = "none";
  scheduleBackBtn.style.display = "none";
  editScheduleBtn.style.display = "none";
  noPermPage.style.display = "none";
  notFoundPage.style.display = "none";
  cleanupToolbar();
}

// ── Route to the correct view based on the current URL ──
function applyRoute() {
  const raw = window.location.pathname;
  const scheduleMatch = raw.match(/\/schedule(?:\.html)?\/(.*)/);

  if (!scheduleMatch) {
    // Just /schedule — show location picker
    hideAllViews();
    scheduleGui.style.display = "flex";
    return;
  }

  const after = scheduleMatch[1].replace(/^\/+/, "");
  if (!after) {
    hideAllViews();
    scheduleGui.style.display = "flex";
    return;
  }

  const parts = after.split("/").filter(Boolean);
  const locSlug = parts[0] || "";
  const storeSlug = parts[1] || "";

  const locKey = slugToLocation(locSlug);
  if (!locKey) {
    hideAllViews();
    notFoundPage.style.display = "flex";
    return;
  }

  if (!storeSlug) {
    // Valid location, no store → show store picker
    hideAllViews();
    storeButtonsContainerSchedule.innerHTML = "";
    const locBtn = document.querySelector(`.schedule-location-btn[data-loc="${locKey}"]`);
    document.getElementById("store-gui-schedule-title").textContent = locBtn ? locBtn.textContent : locKey;
    stores[locKey][currentLangLocal].forEach((store, i) => {
      const b = document.createElement("button");
      b.textContent = store;
      b.dataset.location = locKey;
      b.dataset.storeEN = stores[locKey].EN[i];
      storeButtonsContainerSchedule.appendChild(b);
    });
    storeGuiSchedule.style.display = "flex";
    return;
  }

  const storeEN = slugToStore(locKey, storeSlug);
  if (!storeEN) {
    hideAllViews();
    notFoundPage.style.display = "flex";
    return;
  }

  // Both valid → open store
  const enIdx = stores[locKey].EN.indexOf(storeEN);
  const displayName = enIdx !== -1 ? stores[locKey][currentLangLocal][enIdx] : storeEN;
  openStore(locKey, storeEN, displayName, true);
}

// Run on page load
applyRoute();

// Run on browser back/forward (mouse button 4/5, alt+arrow, etc.)
window.addEventListener("popstate", () => { applyRoute(); });
// Belt-and-suspenders: hide toolbar whenever page is left or hidden
window.addEventListener("pagehide", cleanupToolbar);
document.addEventListener("visibilitychange", () => { if (document.hidden) cleanupToolbar(); });
window.addEventListener("pagehide", autoSaveIfEditing);
document.addEventListener("visibilitychange", () => { if (document.hidden) autoSaveIfEditing(); });
window.addEventListener("popstate", autoSaveIfEditing);

// ── Language ──
function switchLang(lang) {
  currentLangLocal = lang;
  localStorage.setItem('zorbas_lang', lang);
  const t = translations[lang];
  greekBtn.classList.toggle("active", lang === "GR");
  engBtn.classList.toggle("active", lang === "EN");
  document.getElementById("schedule-gui-title").textContent = t.schedule;
  document.querySelectorAll(".schedule-location-btn").forEach(b => { b.textContent = t[`loc_${b.dataset.loc}`]; });
  document.getElementById("back-schedule").textContent = t.back;
  document.getElementById("back-store-schedule").textContent = t.back;
  if(scheduleBackBtn) scheduleBackBtn.textContent = t.back;
  // Rebuild store list and title if the store picker is currently open
  if (currentLocKey && storeGuiSchedule.style.display !== "none") {
    document.getElementById("store-gui-schedule-title").textContent = t[`loc_${currentLocKey}`];
    storeButtonsContainerSchedule.innerHTML = "";
    stores[currentLocKey].EN.forEach((storeEN, i) => {
      const b = document.createElement("button");
      b.textContent = stores[currentLocKey][lang][i];
      b.dataset.location = currentLocKey;
      b.dataset.storeEN = storeEN;
      storeButtonsContainerSchedule.appendChild(b);
    });
  }
  const editBtn = document.getElementById("edit-schedule-btn");
  if(editBtn && !isEditMode) editBtn.textContent = t.editSchedule;
  const pBtn = document.querySelector(".print-schedule-btn");
  if(pBtn) pBtn.textContent = t.printSchedule;
  const tb = document.getElementById("toolbar-sidebar");
  if(tb) {
    const headerSpan = tb.querySelector("span[style*='letter-spacing']");
    if(headerSpan) headerSpan.textContent = t.format;
    const sectionTitles = tb.querySelectorAll(".toolbar-section-title");
    const sectionKeys = ["textStyle","alignment","rowsCols","cell"];
    sectionTitles.forEach((el, i) => { el.textContent = t[sectionKeys[i]] || el.textContent; });
    const btnLabels = { bold:t.bold, italic:t.italic, underline:t.underline, "align-left":t.alignLeft, "align-center":t.alignCenter, "align-right":t.alignRight, "add-row":t.addRow, "remove-row":t.removeRow, "add-column":t.addColumn, "remove-column":t.removeColumn, "color-cell":t.fillColor, "color-text":t.textColor, "clear-cell":t.clearCell };
    tb.querySelectorAll(".toolbar-button[data-action]").forEach(btn => {
      const lbl = btnLabels[btn.dataset.action];
      if(lbl) { const span = btn.querySelectorAll("span")[1]; if(span) span.textContent = lbl; }
    });
  }
  noPermPage.updateLang();
  notFoundPage.updateLang();
}

greekBtn.addEventListener("click", () => switchLang("GR"));
engBtn.addEventListener("click", () => switchLang("EN"));
switchLang(localStorage.getItem('zorbas_lang') || "EN");

fitToScreen();
</script>
